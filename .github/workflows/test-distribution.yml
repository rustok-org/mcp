name: Test Distribution

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Run shellcheck
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/*.sh
          else
            docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:stable scripts/*.sh
          fi

  secret-scan:
    name: Secret Scan (skills + docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # The skill package is what ClawHub scans, and it is published from here.
      # A finding there lands on the storefront, in front of users, with no way
      # to answer it until a maintainer notices — so the same class of check
      # runs on our own pull requests first. Docs are in scope for the same
      # reason: every recipe a user copies ships from this repo.
      #
      # Pinned by digest, like everything else here: a scanner that changes its
      # rules between two pushes turns a gate into a coin toss (this workflow
      # already learned that from hadolint).
      - name: Scan the published surface for secrets
        run: |
          docker run --rm -v "$PWD:/scan:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /scan/skills --no-git --verbose
          docker run --rm -v "$PWD:/scan:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /scan/docs --no-git --verbose

  install-script-syntax:
    name: Install Script Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Test install script parses without errors
        run: bash -n scripts/install.sh

  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # Pinned by digest, like every action in this repo. It was the one
      # unpinned dependency here, and it drifted: a hadolint release added
      # DL3066 and turned every run red — on a Dockerfile line unchanged since
      # June. A linter that can change its mind between two pushes is not a
      # gate, it is a coin toss.
      - name: Run hadolint
        run: |
          docker run --rm -i \
            ghcr.io/hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            hadolint - < Dockerfile

  docker-smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Build Docker image
        run: docker build -t rustok-mcp:test .
      - name: Verify server starts and /health responds
        run: |
          docker run -d --name mcp-smoke \
            -e RUSTOK_MCP_HOST=0.0.0.0 \
            -p 127.0.0.1:3001:3001 \
            rustok-mcp:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/health; then
              echo "health OK"
              docker rm -f mcp-smoke
              exit 0
            fi
            sleep 2
          done
          echo "health check never came up" >&2
          docker logs mcp-smoke >&2
          docker rm -f mcp-smoke
          exit 1

  texts-match-the-wallet:
    name: Texts Match The Wallet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # The live half of the two-part guard. Its load-bearing moment is the pin PR
      # of a release that changes signing: there it must fire by itself, not by
      # someone remembering to run it. Skipped-because-no-podman would be the one
      # outcome worse than red, so podman is verified present before pytest is
      # allowed to make that call.
      - name: Verify podman is present
        run: podman --version
      - uses: astral-sh/setup-uv@v5
      - name: Ask the shipped image what it does about signing
        run: uv run pytest tests/e2e/test_signing_is_refused_e2e.py -m e2e -q
